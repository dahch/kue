[package]
name = "kue"
version = "0.1.0"
description = "Copiloto de memoria para entrevistas"
authors = ["Kue"]
edition = "2021"
rust-version = "1.79"

[lib]
name = "kue_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# test feature allows tauri::test::mock_app() — zero-cost in release builds
# (the module is cfg'd out unless feature is explicitly enabled)
tauri = { version = "2", features = ["test"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.33", features = ["bundled"] }
cpal = "0.15"
hound = "3.5"
rubato = "0.15"
nnnoiseless = "0.5"

[dependencies.screencapturekit]
path = "vendor/screencapturekit-rs/screencapturekit"

[dependencies.candle-core]
version = "0.8"
features = ["metal", "accelerate"]

[dependencies.candle-nn]
version = "0.8"

[dependencies.candle-transformers]
version = "0.8"

[dependencies.hf-hub]
version = "0.4"

[dependencies.tokenizers]
version = "0.21"

[dependencies.bytemuck]
version = "1"

[dependencies.sqlite-vec]
version = "0.1.9"

[dependencies.sha2]
version = "0.10"

[dependencies.hex]
version = "0.4"

[dependencies.libloading]
version = "0.8"

[dependencies.uuid]
version = "1"
features = ["v4"]

[dependencies.pdf-extract]
version = "0.12"

[dependencies.keyring]
version = "2"
features = ["default"]

[dependencies.zip]
version = "2"

[dependencies.reqwest]
version = "0.12"
features = ["json", "blocking"]

[dependencies.tokio]
version = "1"
features = ["time"]

[dependencies.log]
version = "0.4"
features = ["std"]

[dependencies.chrono]
version = "0.4"

[dependencies.tauri-plugin-updater]
version = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
