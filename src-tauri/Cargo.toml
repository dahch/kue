[package]
name = "kue"
version = "0.1.0"
description = "Copiloto de memoria para entrevistas"
authors = ["Kue"]
edition = "2021"
rust-version = "1.79"

[lib]
name = "kue_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.33", features = ["bundled"] }
cpal = "0.15"
hound = "3.5"

[dependencies.screencapturekit]
git = "https://github.com/Brendonovich/screencapturekit-rs"
rev = "9a6b9f3"

[dependencies.candle-core]
version = "0.8"
features = ["metal"]

[dependencies.candle-transformers]
version = "0.8"

[dependencies.sqlite-vec]
version = "0.1.9"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
